name: Generate and submit dependency graph for language-server
on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # ratchet:actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - name: Generate and submit dependency graph for language-server
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # ratchet:gradle/actions/dependency-submission@v6
        with:
          dependency-resolution-task: "dependencies"
          additional-arguments: "--configuration runtimeClasspath --no-configuration-cache"
          dependency-graph: generate-and-submit
