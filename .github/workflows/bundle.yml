# Builds the standalone bundles for all targets on Linux, smoke-tests each one
# on a native runner, and attaches them (and the jar) to a GitHub release when run manually.
name: Bundle

on:
  push:
    branches:
      - 'main'
      # TEMPORARY: test the release job from the PR branch (as a draft release); remove before merging
      - 'java25-aot-bundle'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 26.10.0 (the release is tagged v<version>)'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # tags are needed for the version (git describe)
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version=${INPUT_VERSION#v}
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = java25-aot-bundle ]; then
            # TEMPORARY: fixed version so that test runs reuse the same draft release
            version=0.0.0-test
          else
            version=$(git describe --tags --always)
            version=${version#v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        env:
          # for the Corretto release notes (GitHub API rate limit)
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./gradlew bundleAll "-Pversion=${{ steps.version.outputs.version }}"
          cd build/bundle
          for f in *.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done

      # TODO: remove the jar for 27.04, it is only needed by extension releases that predate the bundle
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/language-server-all.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-linux-x64
          path: build/bundle/*-linux-x64.tar.gz*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-linux-arm64
          path: build/bundle/*-linux-arm64.tar.gz*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-macos-arm64
          path: build/bundle/*-macos-arm64.tar.gz*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-windows-x64
          path: build/bundle/*-windows-x64.tar.gz*
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      # keep LF line endings in the shell scripts and the benchmark workspace
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bundle-${{ matrix.target }}
          path: dist

      - name: Extract
        run: |
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum -c ./*.sha256
          else
            shasum -a 256 -c ./*.sha256
          fi
          tarball=$(ls ./*.tar.gz)
          if [ "$RUNNER_OS" = Windows ]; then
            # the bsdtar of Windows, as used by the VS Code extension (not the GNU tar of Git Bash)
            "$(cygpath "$SYSTEMROOT")/System32/tar.exe" -xzf "$tarball"
            launcher=bin/nextflow-lsp.cmd
          else
            tar -xzf "$tarball"
            launcher=bin/nextflow-lsp
          fi
          home=$PWD/$(basename "$tarball" .tar.gz)
          "$home/runtime/bin/java" -version
          echo "LSP_HOME=$home" >> "$GITHUB_ENV"
          echo "LSP_LAUNCHER=$home/$launcher" >> "$GITHUB_ENV"

      # there is no AOT cache on Windows yet
      - name: Train the AOT cache
        if: runner.os != 'Windows'
        run: |
          "$LSP_LAUNCHER" --train
          test -s "$LSP_HOME/lib/nextflow-lsp.aot"

      - name: Check that stdout is silent and the AOT cache is accepted
        run: |
          # stdout is the LSP channel, so it must stay silent;
          # with AOTMode=on, the server also fails if the cache is rejected
          if [ "$RUNNER_OS" = Windows ]; then
            opts=
          else
            opts=-XX:AOTMode=on
          fi
          msg='{"jsonrpc":"2.0","method":"exit"}'
          printf 'Content-Length: %d\r\n\r\n%s' "${#msg}" "$msg" \
            | NXF_LSP_JAVA_OPTS=$opts "$LSP_LAUNCHER" > stdout.txt
          if [ -s stdout.txt ]; then
            echo "Server wrote to stdout without a client:"
            cat stdout.txt
            exit 1
          fi

      - name: Benchmark
        run: |
          scripts/bench-workspace.sh
          if [ "$RUNNER_OS" = Windows ]; then
            # bench.py passes the command line as is to Windows, which runs the .cmd with cmd.exe
            python scripts/bench.py --workspace build/bench/rnaseq --server-cmd "$(cygpath -w "$LSP_LAUNCHER")" --iterations 3 --cold-iterations 1
          else
            python3 scripts/bench.py --workspace build/bench/rnaseq --server-cmd "$LSP_LAUNCHER" --iterations 3 --cold-iterations 1
          fi

  release:
    name: Release
    # TEMPORARY: also release (as a draft) on push to the PR branch; remove before merging
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'java25-aot-bundle')
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist

      - name: Attach bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
          DRAFT: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
        run: |
          # re-running updates the assets of an existing release
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # the tag is created at the built commit when the release is published
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes "" \
              $( [ "$DRAFT" = true ] && echo --draft )
          fi
