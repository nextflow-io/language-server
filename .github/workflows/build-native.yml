name: Build Native Image

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  GRAALVM_DISTRIBUTION: 'graalvm'
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          # NOTE: there is no free Intel macOS runner; this one is billed per minute
          - os: macos-latest-large
            platform: macos-intel
          - os: macos-latest
            platform: macos-silicon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native image
        run: |
          chmod +x ./gradlew ./lsp-simulator.sh ./build-native.sh ./verify-native.py
          ./build-native.sh

      - name: Package binary
        run: |
          tar -czf nextflow-lsp-${{ matrix.platform }}.tar.gz \
            -C build/native/nativeCompile nextflow-lsp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-lsp-${{ matrix.platform }}
          path: nextflow-lsp-${{ matrix.platform }}.tar.gz
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          cd release
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
