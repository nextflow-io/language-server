plugins {
  id 'com.gradleup.shadow' version '9.4.3'
  id 'application'
  id 'groovy'
  id 'java'
}

repositories {
  mavenLocal()
  mavenCentral()
  maven { url = "https://s3-eu-west-1.amazonaws.com/maven.seqera.io/releases" }
  maven { url = "https://s3-eu-west-1.amazonaws.com/maven.seqera.io/snapshots" }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
    vendor = JvmVendorSpec.AMAZON
  }
}

// the jar also runs on the user's Java, so it targets the minimum Java version of Nextflow
tasks.withType(JavaCompile).configureEach {
  options.release = 17
}

compileJava {
  options.compilerArgs << '-parameters'
}

test {
  useJUnitPlatform()
}

configurations {
  groovyCompiler
  nextflowRuntime
}

// Pin the Groovy compiler classpath: the Groovy plugin otherwise infers a full
// groovy-all classpath, dragging in Ant (groovy-ant) and javaparser/qdox
// (groovy-groovydoc), none of which this build uses
tasks.withType(GroovyCompile).configureEach {
  groovyClasspath = configurations.groovyCompiler
}

// nf-lang depends on the full ANTLR tool (and its deps ST4, antlr3, treelayout), but its
// generated parsers only need the ANTLR runtime (at the same version)
configurations.matching { it.name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
  resolutionStrategy.eachDependency {
    if( requested.group == 'me.sunlan' && requested.name == 'antlr4' ) {
      useTarget("me.sunlan:antlr4-runtime:${requested.version}")
      because 'only the ANTLR runtime is needed'
    }
  }
}

dependencies {
  groovyCompiler 'org.apache.groovy:groovy:4.0.33'

  implementation 'io.nextflow:nf-lang:26.10.3'
  implementation 'org.apache.groovy:groovy:4.0.33'
  implementation 'org.apache.groovy:groovy-json:4.0.33'
  // Jackson is only used internally (by YamlConverter) when YAML is actually parsed or built,
  // whereas the language server only resolves YamlSlurper/YamlBuilder when checking scripts
  implementation('org.apache.groovy:groovy-yaml:4.0.33') {
    exclude group: 'com.fasterxml.jackson.core'
    exclude group: 'com.fasterxml.jackson.dataformat'
  }
  implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.23.0'
  implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.23.0'

  // runtime dependencies for Nextflow scripts
  runtimeOnly 'org.apache.groovy:groovy-templates:4.0.33'
  runtimeOnly 'org.yaml:snakeyaml:2.4'

  // include Nextflow runtime at build-time to extract language definitions
  nextflowRuntime 'io.nextflow:nextflow:26.10.3'
  nextflowRuntime 'io.nextflow:nf-amazon:3.12.1'
  nextflowRuntime 'io.nextflow:nf-azure:1.24.2'
  nextflowRuntime 'io.nextflow:nf-google:1.29.1'
  nextflowRuntime 'io.nextflow:nf-k8s:1.6.1'
  nextflowRuntime 'io.nextflow:nf-seqera:0.26.0'
  nextflowRuntime 'io.nextflow:nf-tower:1.32.1'
  nextflowRuntime 'io.nextflow:nf-wave:1.22.3'

  testImplementation ('org.objenesis:objenesis:3.4')
  testImplementation ('net.bytebuddy:byte-buddy:1.14.17')
  testImplementation ('org.spockframework:spock-core:2.4-groovy-4.0') { exclude group: 'org.apache.groovy' }
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
  spec {
    groovy.srcDir 'src/spec/groovy'
    compileClasspath += configurations.nextflowRuntime
    runtimeClasspath += configurations.nextflowRuntime
  }
}

configurations {
  specImplementation.extendsFrom(nextflowRuntime)
}

task buildSpec(type: JavaExec) {
  description = 'Build spec file of core definitions'
  group = 'build'

  dependsOn compileSpecGroovy
  classpath = sourceSets.spec.runtimeClasspath
  mainClass.set('nextflow.SpecWriter')
  // Use our own logback config instead of the DEBUG-level logback-test.xml
  // bundled in nextflow plugin jars (e.g. nf-google)
  systemProperty 'logback.configurationFile', file('src/spec/resources/logback.xml').absolutePath
  args "$buildDir/generated/definitions.json"

  outputs.file("$buildDir/generated/definitions.json")
  outputs.cacheIf { true }
}

processResources {
  dependsOn buildSpec
  from(buildSpec.outputs.files) {
    into 'spec'
  }
}

jar {
  dependsOn buildSpec
}

application {
  mainClass = 'nextflow.lsp.NextflowLanguageServer'
}

shadowJar {
  archiveVersion = ''
  // Groovy shades the full ANTLR tool, but its parser only needs the ANTLR runtime
  // (groovyjarjarantlr4/v4/runtime), and nf-lang uses its own parser anyway
  exclude 'groovyjarjarantlr4/runtime/**'     // ANTLR 3 runtime, used only by the tool
  exclude 'groovyjarjarantlr4/v4/*.class'     // Tool
  ['analysis', 'automata', 'codegen', 'gui', 'misc', 'parse', 'semantics', 'tool', 'unicode'].each {
    exclude "groovyjarjarantlr4/v4/${it}/**"
  }
}

apply from: 'gradle/bundle.gradle'
