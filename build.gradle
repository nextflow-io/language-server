plugins {
  id 'com.gradleup.shadow' version '8.3.5'
  id 'org.graalvm.buildtools.native' version '0.10.4'
  id 'application'
  id 'groovy'
  id 'java'
}

repositories {
  mavenLocal()
  mavenCentral()
  maven { url = "https://s3-eu-west-1.amazonaws.com/maven.seqera.io/releases" }
  maven { url = "https://s3-eu-west-1.amazonaws.com/maven.seqera.io/snapshots" }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
  options.release.set(17)
  options.compilerArgs << '-parameters'
}

test {
  useJUnitPlatform()
}

configurations {
  nextflowRuntime
}

dependencies {
  implementation 'io.nextflow:nf-lang:26.04.6'
  implementation 'org.apache.groovy:groovy:4.0.31'
  implementation 'org.apache.groovy:groovy-json:4.0.31'
  implementation 'org.apache.groovy:groovy-yaml:4.0.31'
  implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.23.0'
  implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.23.0'

  // runtime dependencies for Nextflow scripts
  runtimeOnly 'org.apache.groovy:groovy-templates:4.0.31'
  runtimeOnly 'org.yaml:snakeyaml:2.2'

  // include Nextflow runtime at build-time to extract language definitions
  nextflowRuntime 'io.nextflow:nextflow:26.04.6'
  nextflowRuntime 'io.nextflow:nf-amazon:3.9.2'
  nextflowRuntime 'io.nextflow:nf-azure:1.22.6'
  nextflowRuntime 'io.nextflow:nf-google:1.27.3'
  nextflowRuntime 'io.nextflow:nf-k8s:1.5.4'
  nextflowRuntime 'io.nextflow:nf-seqera:0.21.1'
  nextflowRuntime 'io.nextflow:nf-tower:1.28.2'
  nextflowRuntime 'io.nextflow:nf-wave:1.21.0'

  testImplementation ('org.objenesis:objenesis:3.4')
  testImplementation ('net.bytebuddy:byte-buddy:1.14.17')
  testImplementation ('org.spockframework:spock-core:2.4-groovy-4.0') { exclude group: 'org.apache.groovy' }
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
  spec {
    groovy.srcDir 'src/spec/groovy'
    compileClasspath += configurations.nextflowRuntime
    runtimeClasspath += configurations.nextflowRuntime
  }
}

configurations {
  specImplementation.extendsFrom(nextflowRuntime)
}

task buildSpec(type: JavaExec) {
  description = 'Build spec file of core definitions'
  group = 'build'

  dependsOn compileSpecGroovy
  classpath = sourceSets.spec.runtimeClasspath
  mainClass.set('nextflow.SpecWriter')
  // Use our own logback config instead of the DEBUG-level logback-test.xml
  // bundled in nextflow plugin jars (e.g. nf-google)
  systemProperty 'logback.configurationFile', file('src/spec/resources/logback.xml').absolutePath
  args "$buildDir/generated/definitions.json"

  outputs.file("$buildDir/generated/definitions.json")
  outputs.cacheIf { true }
}

processResources {
  dependsOn buildSpec
  from(buildSpec.outputs.files) {
    into 'spec'
  }
}

jar {
  dependsOn buildSpec
}

application {
  mainClass = 'nextflow.lsp.NextflowLanguageServer'
}

shadowJar {
  archiveVersion = ''
}

// native-image metadata derived from the classpath instead of observed.
//
// The tracing agent below only records what one simulated LSP session happens
// to touch, so any code path it misses ships a binary that fails at runtime --
// and fails SILENTLY, because --report-unsupported-elements-at-runtime turns
// what would be build errors into runtime no-ops. The two failures that
// motivated this: the server could not deserialize
// workspace/didChangeConfiguration (so no language feature worked at all), and
// it reported "Unrecognized process input qualifier `val`" on valid scripts.
//
// These class sets are reflected over wholesale, so they can be enumerated.
// Every group cites the reflective call site that justifies it, and the flags
// are deliberately narrow: cost here is driven by reachability, not by entry
// count, so allDeclaredMethods on a 538-class package is not free.
def reflectionGroups = [
  [
    // Gson binds every LSP message type by field reflection and constructs it
    // with the no-arg ctor. Without the ctor it falls back to UnsafeAllocator,
    // which native-image rejects: "instantiated reflectively but was never
    // registered". No methods are needed -- Gson never calls the accessors.
    prefixes: ['org.eclipse.lsp4j.'],
    excludePrefixes: ['org.eclipse.lsp4j.services.'],
    flags: ['allDeclaredFields', 'allDeclaredConstructors'],
  ],
  [
    // lsp4j's jsonrpc layer enumerates @JsonRequest/@JsonNotification methods
    // on the service interfaces and invokes them on the delegate.
    prefixes: ['org.eclipse.lsp4j.services.'],
    classes: ['nextflow.lsp.NextflowLanguageServer'],
    flags: ['allDeclaredFields', 'allDeclaredMethods', 'allDeclaredConstructors'],
  ],
  [
    // VariableScopeChecker.pushScope(Class) -> ClassHelper.makeCached ->
    // Java8.configureClassNode, which reads getDeclaredFields/Methods/
    // Constructors. configureAnnotation then INVOKES the annotation accessors
    // (Description.value(), Constant.value(), Ops.value(), ...), so these need
    // allDeclaredMethods rather than the query-only variant.
    //
    // nextflow.script.types. also covers the .shim.* value types and their
    // package-private *Ops interfaces, which is where completion and hover on
    // String/List/Map/Path come from.
    prefixes: [
      'nextflow.script.dsl.',
      'nextflow.script.types.',
      'nextflow.config.spec.',
    ],
    classes: [
      'groovy.lang.Closure',
      'groovy.transform.NamedParam',
      'groovy.transform.NamedParams',
      'java.lang.Boolean',
      'java.lang.Deprecated',
      'java.lang.FunctionalInterface',
    ],
    flags: ['allDeclaredFields', 'allDeclaredMethods', 'allDeclaredConstructors'],
  ],
  [
    // Walked for members via the same ClassNode path, but nothing here has an
    // annotation whose accessors get invoked, so query-only is enough.
    prefixes: [
      'nextflow.script.namespaces.',
      'nextflow.config.scopes.',
    ],
    classes: [
      'nextflow.config.dsl.ConfigDsl',
      'java.util.function.BiConsumer',
      'java.util.function.BiFunction',
      'java.util.function.BiPredicate',
      'java.util.function.Consumer',
      'java.util.function.Function',
      'java.util.function.Predicate',
    ],
    flags: ['allDeclaredFields', 'queryAllDeclaredMethods', 'queryAllDeclaredConstructors'],
  ],
  [
    // Named by META-INF/services/...ASTTransformation and instantiated with a
    // no-arg Constructor.newInstance by Groovy's transform loader.
    classes: ['groovy.grape.GrabAnnotationTransformation'],
    flags: ['allDeclaredConstructors'],
  ],
]

// Classpath resources. The traced config registers a few JDK service files but
// no application resource at all -- spec/definitions.json is read only when a
// .config file is opened, which no traced session did.
def resourcePatterns = [
  'spec/definitions.json',
  'META-INF/services/org.codehaus.groovy.transform.ASTTransformation',
]

// Proxy interfaces, in this exact order -- lsp4j's jsonrpc layer builds the
// remote endpoint with java.lang.reflect.Proxy, and native-image keys on the
// interface list positionally. Without this the binary dies on startup with
// MissingReflectionRegistrationError before answering anything.
def proxyInterfaces = [
  ['org.eclipse.lsp4j.services.LanguageClient', 'org.eclipse.lsp4j.jsonrpc.Endpoint'],
]

tasks.register('generateNativeImageMetadata') {
  description = 'Generate native-image configuration statically from the classpath'
  group = 'native'

  def outputDir = file("$buildDir/native-image-static")
  def classpath = configurations.runtimeClasspath
  def classesDirs = sourceSets.main.output.classesDirs

  inputs.files(classpath)
  inputs.files(classesDirs)
  inputs.property('reflectionGroups', reflectionGroups.toString())
  inputs.property('resourcePatterns', resourcePatterns)
  inputs.property('proxyInterfaces', proxyInterfaces.toString())
  outputs.dir(outputDir)

  doLast {
    // every class on the runtime classpath, including nested and
    // package-private types -- the shim *Ops interfaces are both
    def available = new TreeSet<String>()

    classpath.filter { it.name.endsWith('.jar') }.each { jar ->
      new java.util.zip.ZipFile(jar).withCloseable { zip ->
        zip.entries().each { entry ->
          if( entry.name.endsWith('.class') && !entry.name.contains('module-info') )
            available.add(entry.name[0..-7].replace('/', '.'))
        }
      }
    }

    classesDirs.each { dir ->
      if( !dir.isDirectory() )
        return
      dir.traverse(type: groovy.io.FileType.FILES, nameFilter: ~/.*\.class/) { f ->
        def path = dir.toPath().relativize(f.toPath()).toString()
        available.add(path[0..-7].replace(File.separator, '.'))
      }
    }

    def entries = []
    def registered = new TreeSet<String>()

    reflectionGroups.each { group ->
      def prefixes = group.prefixes ?: []
      def excludes = group.excludePrefixes ?: []
      def names = new TreeSet<String>(group.classes ?: [])

      available.each { name ->
        if( prefixes.any { name.startsWith(it) } && !excludes.any { name.startsWith(it) } )
          names.add(name)
      }

      names.each { name ->
        def entry = [name: name]
        group.flags.each { entry[it] = true }
        entries.add(entry)
        registered.add(name)
      }
    }

    outputDir.mkdirs()

    def json = groovy.json.JsonOutput
    new File(outputDir, 'reflect-config.json').text =
      json.prettyPrint(json.toJson(entries))
    new File(outputDir, 'proxy-config.json').text =
      json.prettyPrint(json.toJson(proxyInterfaces.collect { [interfaces: it] }))
    new File(outputDir, 'resource-config.json').text = json.prettyPrint(json.toJson([
      resources: [includes: resourcePatterns.collect { [pattern: "\\Q${it}\\E".toString()] }],
      bundles: [],
    ]))

    logger.lifecycle("native-image: registered ${registered.size()} classes, " +
      "${resourcePatterns.size()} resources, ${proxyInterfaces.size()} proxies")
  }
}

task generateNativeImageConfig(type: Exec) {
  description = 'Generate native-image configuration using tracing agent'
  group = 'native'

  dependsOn shadowJar

  def agentOutputDir = file("$buildDir/native-image-agent")
  def simulateScript = file("$projectDir/native/simulate.sh")

  inputs.file(shadowJar.archiveFile)
  inputs.file(simulateScript)
  outputs.dir(agentOutputDir)

  doFirst {
    agentOutputDir.mkdirs()
  }

  commandLine 'bash', '-c', """
    ${simulateScript.absolutePath} | java \\
      -agentlib:native-image-agent=config-output-dir=${agentOutputDir.absolutePath} \\
      -cp ${shadowJar.archiveFile.get().asFile.absolutePath} \\
      nextflow.lsp.NextflowLanguageServer
  """
}

tasks.named('nativeCompile') {
  // native-image reads all three config directories via
  // -H:ConfigurationFileDirectories, which Gradle cannot see. Without these
  // declarations a metadata change reports UP-TO-DATE and silently ships the
  // previously built binary. Passing the producing tasks as file inputs both
  // registers their outputs and creates the task dependency.
  inputs.files(tasks.named('generateNativeImageMetadata'))
  inputs.files(tasks.named('generateNativeImageConfig'))
  inputs.dir("$projectDir/conf/native-image")
}

graalvmNative {
  binaries {
    main {
      imageName = 'nextflow-lsp'
      mainClass = 'nextflow.lsp.NextflowLanguageServer'
      buildArgs.addAll([
        '--no-fallback',
        '--enable-url-protocols=http,https',
        '-H:+ReportExceptionStackTraces',
        // required: Groovy's indy call sites reach MethodHandleNatives
        // methods that native-image cannot compile ahead of time. Deprecated
        // upstream, so this will need another answer in a future GraalVM.
        '--report-unsupported-elements-at-runtime',
        '--initialize-at-build-time=org.slf4j',
        '--initialize-at-build-time=org.apache.groovy',
        '--initialize-at-build-time=groovy',
        '--initialize-at-build-time=org.codehaus.groovy',
        '--initialize-at-build-time=groovyjarjarantlr4',
        '--initialize-at-build-time=java.beans',
        '--initialize-at-build-time=com.sun.beans',
        // static metadata first, then the traced metadata for the tail that
        // genuinely cannot be enumerated (Groovy indy call sites, JDK internals)
        "-H:ConfigurationFileDirectories=$buildDir/native-image-static,$buildDir/native-image-agent,$projectDir/conf/native-image"
      ])
    }
  }
  toolchainDetection = false
}
